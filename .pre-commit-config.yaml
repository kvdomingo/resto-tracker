repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [ --fix ]
        files: ^api/
      - id: ruff-format
        files: ^api/
  - repo: local
    hooks:
      # biome must run from ui/ so it treats ui/biome.json as the root config
      - id: biome-check
        name: biome check
        language: node
        entry: bash -c 'cd ui && exec bun run biome check --write --no-errors-on-unmatched .'
        files: ^ui/
        pass_filenames: false
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.52
    hooks:
      - id: rumdl-fmt
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      # schema.sql is pg_dump output, not hand-written
      - id: sqlfluff-lint
        args: [ --config, api/pyproject.toml ]
        exclude: ^api/repositories/sql/schema\.sql$
      - id: sqlfluff-fix
        args: [ --config, api/pyproject.toml ]
        exclude: ^api/repositories/sql/schema\.sql$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ "--maxkb=500" ]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [ "--fix=lf" ]
      - id: check-merge-conflict
      - id: check-yaml
        args: [ "--allow-multiple-documents" ]
      - id: check-json
      - id: check-toml
      - id: check-xml
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        args: [ "--verbose" ]
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        args:
          - --ignore
          - DL3008
          - --ignore
          - DL3018

exclude: infra/
